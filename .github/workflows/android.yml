name: Android APK
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm test
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module -e 'import pkg from "./package.json" with { type: "json" }; if (process.env.RELEASE_TAG !== `v${pkg.version}`) throw new Error("Release tag must match package.json version");'
      - name: Prepare release signing
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Configure Android release signing secrets before creating a release tag.'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/power-log.jks"
          chmod 600 "$RUNNER_TEMP/power-log.jks"
      - name: Build signed release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          POWER_LOG_ANDROID_VERSION_CODE: ${{ github.run_number }}
          POWER_LOG_ANDROID_KEYSTORE: ${{ runner.temp }}/power-log.jks
          POWER_LOG_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          POWER_LOG_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          POWER_LOG_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: npm run build:android
      - name: Build preview
        if: "!startsWith(github.ref, 'refs/tags/v')"
        env:
          POWER_LOG_ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: npm run build:android -- --preview
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-apk
          path: artifacts/builds/android/*.apk
          if-no-files-found: error
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/power-log.jks"
      - name: Upload native test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-test-reports
          path: modules/cyc-bridge/android/build/reports/tests/
          if-no-files-found: ignore
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: android-apk
      - name: Attach signed APK and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sha256sum power-log.apk > SHA256SUMS.txt
          gh release view "$RELEASE_TAG" || gh release create "$RELEASE_TAG" --verify-tag --generate-notes
          gh release upload "$RELEASE_TAG" power-log.apk SHA256SUMS.txt --clobber
